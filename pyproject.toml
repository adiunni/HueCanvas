[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "huecanvas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic", "pillow", "numpy", "scikit-learn", "httpx", "python-multipart", "python-dotenv", "scipy", "sounddevice"]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["."]
